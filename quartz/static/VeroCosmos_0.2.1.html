    <div id="search-wrap"><span id="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar objetos o grupos…" autocomplete="off" aria-label="Buscar objetos o grupos" aria-controls="results"><div id="results" role="listbox"></div></div>
    <div id="nav"><button id="goHome">Atlas Fotogr&aacute;fico</button><button id="all">Ver todo el atlas</button></div>
    <div id="msg">Cargando…</div>
    <button id="recenter" type="button" aria-label="Restablecer orientación y zoom" title="Volver a la posición original">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v4M12 18.2v4M1.8 12h4M18.2 12h4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
  <aside id="panel"><button id="close" aria-label="Cerrar">×</button><iframe id="frame" title="Información"></iframe></aside>
  <aside id="mini" aria-label="Resumen del objeto"><div class="m-in"><button id="mclose" type="button" aria-label="Cerrar">&times;</button><img class="m-img" alt=""><div class="m-body"><h2 class="m-title"></h2><p class="m-date"></p><p class="m-text"></p><button id="mfull" type="button">Ver ficha completa &rarr;</button></div></div></aside>
</div>
<div id="tip"></div>
<script>
(async()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),msg=$('msg');
// Menú de páginas: Principal y Atlas.
const menuToggle=$('menu-toggle'),pageMenu=$('page-menu'),atlasPageLink=$('atlas-page-link'),principalPageLink=$('principal-page-link');
const featuredAtlasLink=$('featured-atlas-link');
atlasPageLink.href='#atlas';
menuToggle.addEventListener('click',()=>{
  const open=pageMenu.classList.toggle('open');
  menuToggle.setAttribute('aria-expanded',String(open));
  menuToggle.setAttribute('aria-label',open?'Cerrar menú de páginas':'Abrir menú de páginas');
});
document.addEventListener('pointerdown',ev=>{
  if(!$('menu-wrap').contains(ev.target)){
    pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas');
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas');
  }
});
function closePageMenu(){pageMenu.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Abrir menú de páginas')}
function setPageActive(page){
  const isPrincipal=page==='principal';
  document.body.classList.toggle('principal-page',isPrincipal);
  if(isPrincipal){closePanel();$('principal-page-link').setAttribute('aria-current','page');atlasPageLink.removeAttribute('aria-current')}
  else{$('principal-page-link').removeAttribute('aria-current');atlasPageLink.setAttribute('aria-current','page');closePanel();setView(null)}
  closePageMenu();
}
principalPageLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('principal')});
atlasPageLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('atlas')});
featuredAtlasLink.addEventListener('click',ev=>{ev.preventDefault();setPageActive('atlas');setView(home)});
let W=1,H=1,sc=1;
// Orientación y zoom 3D compartidos por todas las vistas del atlas.
// Cada recarga empieza con una orientación y una media esfera irregular nuevas.
// skyCenter se recalcula a partir del centroide geométrico de todos los nodos visibles.
let skyCenter={x:0,y:0,z:0};
let skyYaw=Math.random()*Math.PI*2,skyPitch=(Math.random()-.5)*Math.PI*.8,skyZoom=.82+Math.random()*.36;
const homeOrientation={yaw:skyYaw,pitch:skyPitch,zoom:skyZoom};
// Las vistas de grupo conservan su distribución 2D original al abrirse; la rotación y el zoom son opcionales.
let groupYaw=0,groupPitch=0,groupZoom=1,dragging=false,dragMoved=false,lastPointer=null;
let resetAnimation=null;
const stars=Array.from({length:200},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.6+.2}));
new ResizeObserver(()=>{const d=devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);try{window.__sync=true;draw()}catch(e){}finally{window.__sync=false}}).observe(cv);

// ---- Datos: salen de contentIndex.json, que Quartz genera solo
let idx={};
try{idx=await(await fetch('contentIndex.json')).json()}catch(e){msg.textContent='No se pudo cargar contentIndex.json. Abre esta página desde la web, no como archivo suelto.';return}
const N={},E=[],seen=new Set();
for(const s in idx)N[s]={s,t:idx[s].title||s,adj:new Set(),obj:/\/descripciones\//.test(s)};
for(const s in idx)for(let t of idx[s].links||[]){
  t=String(t).replace(/^\//,'');
  if(!N[t])t=N[t+'/index']?t+'/index':null;
  if(!t||t===s)continue;
  const k=[s,t].sort().join('|');if(seen.has(k))continue;seen.add(k);
  E.push([N[s],N[t]]);N[s].adj.add(t);N[t].adj.add(s);
}
const all=Object.values(N).filter(n=>n.adj.size>0);   // las carpetas automáticas sin enlaces no se dibujan
all.forEach((n,i)=>{
  // Cada recarga genera una nube irregular nueva, con forma aproximada de media esfera.
  const a=Math.random()*Math.PI*2;
  const radius=55+Math.pow(Math.random(),.72)*390;
  n.x=Math.cos(a)*radius+(Math.random()-.5)*45;
  n.y=Math.sin(a)*radius+(Math.random()-.5)*45;
  n.vx=n.vy=0;
  // Media esfera irregular: x/y conservan la distribución del atlas y z ocupa
  // el volumen de un hemisferio, con variación aleatoria para evitar una cáscara perfecta.
  const hemiRadius=510;
  const radial2=n.x*n.x+n.y*n.y;
  const cap=Math.sqrt(Math.max(0,hemiRadius*hemiRadius-radial2));
  n.z=Math.random()*cap;
});
if(!all.length){msg.textContent='No hay notas con enlaces para dibujar.';return}
msg.textContent='Arrastra con el ratón para girar cualquier vista en 3D · Rueda para acercar o alejar · Clic en un grupo para explorarlo o en un objeto para abrir su ficha. Usa el botón de objetivo para recentrar.';

// ---- Vista (todo el atlas o un grupo local)
const home=all.find(n=>n.s==='index')||all.find(n=>/atlas/i.test(n.t))||null;
let baseView=all,view=all,vE=E,focus=null,alpha=1,hov=null;
let searchTerm='',matches=new Set(),onlyMatches=false;
const searchInput=$('search'),results=$('results');
// La búsqueda ignora mayúsculas y tildes: catálogo y catalogo coinciden.
function normalizeSearch(value){return value.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function matchAll(n,q){const h=normalizeSearch(n.t+' '+n.s),h2=h.replace(/[\s_\-]+/g,'');return q.split(/\s+/).every(w=>h.includes(w)||h2.includes(w.replace(/[\s_\-]+/g,'')))}
function refreshSearch(){
  const q=normalizeSearch(searchTerm.trim());
  matches=new Set(q?baseView.filter(n=>matchAll(n,q)).map(n=>n.s):[]);
  view=(q&&onlyMatches)?baseView.filter(n=>matches.has(n.s)):baseView;
  vE=E.filter(([a,b])=>view.includes(a)&&view.includes(b));
}
function renderResults(){
  const q=normalizeSearch(searchTerm.trim());
  results.replaceChildren();
  if(!q){results.classList.remove('visible');return}
  const found=baseView.filter(n=>matchAll(n,q)).slice(0,30);
  if(!found.length){const empty=document.createElement('div');empty.className='search-empty';empty.textContent='No hay coincidencias en este grupo.';results.append(empty)}
  else for(const n of found){
    const b=document.createElement('button');b.type='button';b.className='search-result';b.setAttribute('role','option');
    const title=document.createElement('span');title.textContent=n.t;
    const path=document.createElement('small');path.textContent=n.obj?'Objeto · '+n.s:'Grupo · '+n.s;
    b.append(title,path);b.addEventListener('click',()=>{results.classList.remove('visible');searchInput.blur();if(n.obj){openPanel(n)}else{closePanel();setView(n)}});results.append(b);
  }
  results.classList.add('visible');
}
searchInput.addEventListener('input',()=>{searchTerm=searchInput.value;onlyMatches=false;refreshSearch();renderResults();alpha=1});
searchInput.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&searchTerm.trim()){onlyMatches=!onlyMatches;refreshSearch();results.classList.remove('visible');alpha=1;ev.preventDefault()}
  if(ev.key==='Escape'){searchInput.value='';searchTerm='';onlyMatches=false;refreshSearch();renderResults();searchInput.blur();alpha=1}
});
document.addEventListener('pointerdown',ev=>{if(!$('search-wrap').contains(ev.target))results.classList.remove('visible')});
function setView(f){
  focus=f;
  // Cada grupo se abre con exactamente la disposición habitual; el usuario decide si rotarlo.
  groupYaw=0;groupPitch=0;groupZoom=1;sc=1;
  msg.textContent=f?'Vista de grupo 3D · Arrastra con el ratón para girar · Rueda para acercar o alejar · Clic en un objeto para abrir su ficha o en otro grupo para explorarlo.':'Bóveda celeste 3D · Arrastra con el ratón para girar · Rueda para acercar o alejar · Clic en un objeto para abrir su ficha.';
  const keep=f?new Set([f.s,...f.adj]):null;
  baseView=f?all.filter(n=>keep.has(n.s)&&!isParent(n,f)):all;
  refreshSearch();renderResults();
  $('goHome').style.display=home?'block':'none';$('all').style.display='block';$('goHome').classList.toggle('active',!!home&&f===home);$('all').classList.toggle('active',!f);
  alpha=1;
}

// ---- Física sencilla de fuerzas
function step(){
  // Mantiene la distribución dinámica original de la red tanto en vista completa como en grupos.
  const L=focus?120:75,rep=focus?9000:4000;
  for(let i=0;i<view.length;i++)for(let j=i+1;j<view.length;j++){
    const a=view[i],b=view[j];let dx=a.x-b.x,dy=a.y-b.y;const d2=dx*dx+dy*dy+.5,d=Math.sqrt(d2),f=rep/d2*alpha;
    dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
  }
  for(const [a,b] of vE){
    if(!view.includes(a)||!view.includes(b))continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-L)*.02*alpha;
    a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
  }
  for(const n of view){n.vx-=n.x*.01*alpha;n.vy-=n.y*.01*alpha;n.vx*=.85;n.vy*=.85;n.x+=n.vx;n.y+=n.vy}
  alpha=Math.max(alpha*.994,.04);
}
const R=n=>n.obj?5:7+Math.min(n.adj.size,10)*.9;
let skyExtent=220;
function skyPoint(n){
  const cy=Math.cos(skyYaw),sy=Math.sin(skyYaw),cx=Math.cos(skyPitch),sx=Math.sin(skyPitch);
  // Traslada cada punto respecto al centro geométrico antes de rotarlo.
  const nx=n.x-skyCenter.x,ny=n.y-skyCenter.y,nz=n.z-skyCenter.z;
  const x=nx*cy+nz*sy,z0=-nx*sy+nz*cy;
  const y=ny*cx-z0*sx,z=y*sx+z0*cx;
  const baseScale=Math.min(W,H)*.46/(skyExtent+70)*skyZoom;
  // Perspectiva suave: los nodos cercanos se ven algo mayores y los lejanos se comprimen.
  const perspective=700/Math.max(360,700-z);
  const scale=baseScale*perspective;
  return {x:W/2+x*scale,y:H/2-y*scale,z:z/skyExtent,depth:z,perspective};
}
function groupPoint(n){
  // Proyección ortográfica para grupos: con yaw/pitch=0 se ve exactamente como antes.
  const nx=n.x-skyCenter.x,ny=n.y-skyCenter.y,nz=n.z-skyCenter.z;
  const cy=Math.cos(groupYaw),sy=Math.sin(groupYaw),cx=Math.cos(groupPitch),sx=Math.sin(groupPitch);
  const x=nx*cy+nz*sy,z0=-nx*sy+nz*cy;
  const y=ny*cx-z0*sx;
  return [W/2+skyCenter.x*sc+x*sc*groupZoom,H/2+skyCenter.y*sc+y*sc*groupZoom];
}
const pos=n=>focus?groupPoint(n):(()=>{const p=skyPoint(n);return[p.x,p.y]})();

function draw(){
  step();
  // Centro geométrico de la vista activa, usado para ambas modalidades de rotación.
  let sx=0,sy=0,sz=0;
  for(const n of view){sx+=n.x;sy+=n.y;sz+=n.z}
  const count=Math.max(1,view.length);
  skyCenter={x:sx/count,y:sy/count,z:sz/count};
  skyExtent=1;
  for(const n of view)skyExtent=Math.max(skyExtent,Math.abs(n.x-skyCenter.x),Math.abs(n.y-skyCenter.y),Math.abs(n.z-skyCenter.z));
  if(focus){
    // Conserva el autoajuste que tenían las vistas de grupo antes de añadir controles 3D.
    let m=1;for(const n of view)m=Math.max(m,Math.abs(n.x),Math.abs(n.y));
    const target=Math.min(Math.max(Math.min(W,H)/2/(m+70),.3),2.2);sc+=(target-sc)*.06;
  }
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0c1030');g.addColorStop(1,'#05060f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle='rgba(220,230,255,'+s.a+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
  for(const [a,b] of vE){
    if(!view.includes(a)||!view.includes(b))continue;
    const on=hov&&(a===hov||b===hov),[x1,y1]=pos(a),[x2,y2]=pos(b);
    if(focus)ctx.strokeStyle=on?'rgba(255,212,121,.7)':'rgba(138,180,255,.22)';
    else{const za=skyPoint(a).z,zb=skyPoint(b).z;ctx.strokeStyle=on?'rgba(255,212,121,.78)':(za<-.15&&zb<-.15?'rgba(138,180,255,.045)':'rgba(138,180,255,.18)');}
    ctx.lineWidth=on?1.4:.8;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  for(const n of view){
    const [x,y]=pos(n),r=R(n),near=hov&&(n===hov||hov.adj.has(n.s)),matched=searchTerm.trim()&&matches.has(n.s);
    const depth=focus?0:skyPoint(n).z;
    ctx.globalAlpha=searchTerm.trim()&&!matched&&!onlyMatches?.3:(hov&&!near?.35:1);
    if(!focus&&depth<-.15)ctx.globalAlpha*=.28;
    ctx.shadowBlur=n===hov?24:(!focus&&depth<-.15?4:12);ctx.shadowColor=n.obj?'#ffd479':'#8ab4ff';
    ctx.fillStyle=n.obj?'#ffd479':'#cfe0ff';
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.shadowBlur=0;
    if(matched){
      // Resalta la coincidencia con un aro rojo independiente, sin teñir la estrella ni sus conexiones.
      ctx.save();ctx.globalAlpha=1;ctx.shadowColor='#ff304f';ctx.shadowBlur=14;
      ctx.strokeStyle='#ff304f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+5,0,6.283);ctx.stroke();ctx.restore();
    }
    if((!n.obj||n===hov||focus)&& (focus||depth>-.25||n===hov)){ctx.fillStyle='#c9d1f2';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText(n.t,x,y-r-7)}
    ctx.globalAlpha=1;
  }
  if(!window.__sync)requestAnimationFrame(draw);
}

// ---- Vista previa al pasar el ratón: lee la propia página de la nota
const noLinks=x=>{const c=x.cloneNode(true);c.querySelectorAll('a').forEach(a=>a.remove());return c.textContent.trim()};
const pageUrl=s=>new URL(('../'+s.split('/').map(encodeURIComponent).join('/')).replace(/index$/,''),location.href).href;
const cache=new Map();
function preview(n){
  if(!cache.has(n.s))cache.set(n.s,(async()=>{
    try{
      const u=pageUrl(n.s),doc=new DOMParser().parseFromString(await(await fetch(u)).text(),'text/html');
      const art=doc.querySelector('article')||doc.body,img=art.querySelector('img');
      const md=((doc.querySelector('meta[name="description"]')||{}).content||'').trim();const p=md||[...art.querySelectorAll('p')].filter(x=>noLinks(x).length>20).map(x=>x.textContent.trim()).find(Boolean)||'';
      return{img:img?new URL(img.getAttribute('src'),u).href:'',txt:(p.length>320?p.slice(0,320).replace(/\s+\S*$/,"")+"\u2026":p)};
    }catch(e){return{img:'',txt:''}}
  })());
  return cache.get(n.s);
}
const tip=$('tip');
async function showTip(n,ev){
  tip.innerHTML='<b></b>';tip.firstChild.textContent=n.t;tip.style.display='block';moveTip(ev);const pv=await preview(n);if(hov!==n)return;
  tip.innerHTML=(pv.img?'<img src="'+pv.img+'" alt="">':'')+'<b></b><span></span>';
  tip.querySelector('b').textContent=n.t;tip.querySelector('span').textContent=(n.obj?pv.txt:'')||(n.obj?'Clic para abrir la ficha':'Clic para ver su grupo');
  tip.style.display='block';moveTip(ev);{const im=tip.querySelector('img');if(im)im.onload=()=>moveTip(ev)}
}
function moveTip(ev){const x=Math.min(ev.clientX+16,innerWidth-266),y=Math.min(ev.clientY+16,innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'}

// ---- Interacción
function hit(ev){
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;let best=null,bd=1e9;
  for(const n of view){const [x,y]=pos(n),d=Math.hypot(x-mx,y-my);if(d<R(n)+9&&d<bd){best=n;bd=d}}
  return best;
}
function animateRecenter(){
  if(resetAnimation)cancelAnimationFrame(resetAnimation);
  const start=performance.now(),duration=520;
  const from=focus?{yaw:groupYaw,pitch:groupPitch,zoom:groupZoom}:{yaw:skyYaw,pitch:skyPitch,zoom:skyZoom};
  const target=focus?{yaw:0,pitch:0,zoom:1}:homeOrientation;
  // Elegimos el recorrido angular más corto, sin limitar el giro vertical.
  const yawDelta=Math.atan2(Math.sin(target.yaw-from.yaw),Math.cos(target.yaw-from.yaw));
  const frame=now=>{
    const t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,3);
    const yaw=from.yaw+yawDelta*eased,pitch=from.pitch+(target.pitch-from.pitch)*eased,zoom=from.zoom+(target.zoom-from.zoom)*eased;
    if(focus){groupYaw=yaw;groupPitch=pitch;groupZoom=zoom}else{skyYaw=yaw;skyPitch=pitch;skyZoom=zoom}
    if(t<1)resetAnimation=requestAnimationFrame(frame);else resetAnimation=null;
  };
  resetAnimation=requestAnimationFrame(frame);
}
$('recenter').addEventListener('click',animateRecenter);
cv.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  if(resetAnimation){cancelAnimationFrame(resetAnimation);resetAnimation=null;}
  dragging=true;dragMoved=false;lastPointer={x:ev.clientX,y:ev.clientY};cv.setPointerCapture?.(ev.pointerId);cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',ev=>{
  if(dragging&&lastPointer){
    const dx=ev.clientX-lastPointer.x,dy=ev.clientY-lastPointer.y;
    if(Math.abs(dx)+Math.abs(dy)>1)dragMoved=true;
    if(focus){groupYaw+=dx*.006;groupPitch+=dy*.006;}
    else{skyYaw+=dx*.006;skyPitch+=dy*.006;}
    lastPointer={x:ev.clientX,y:ev.clientY};
    if(dragMoved){hov=null;tip.style.display='none';cv.style.cursor='grabbing';return}
  }
});
window.addEventListener('pointerup',()=>{dragging=false;lastPointer=null;cv.style.cursor='grab'});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  if(focus)groupZoom=Math.max(.35,Math.min(3.5,groupZoom*Math.exp(-ev.deltaY*.001)));
  else skyZoom=Math.max(.55,Math.min(2.5,skyZoom*Math.exp(-ev.deltaY*.001)));
},{passive:false});
cv.addEventListener('mousemove',ev=>{
  if(dragging)return;
  const n=hit(ev);cv.style.cursor=n?'pointer':'grab';
  if(n!==hov){hov=n;tip.style.display='none';if(n)showTip(n,ev)}else if(n)moveTip(ev);
});
cv.addEventListener('mouseleave',()=>{if(!dragging){hov=null;tip.style.display='none'}});
cv.addEventListener('click',ev=>{
  if(dragMoved){dragMoved=false;return}
  const n=hit(ev);if(!n)return;hov=n;
  if(n.obj||(n===focus&&/seestar/i.test(n.s)))openPanel(n);else{closePanel();setView(n)}
});
function openFull(n){closeMini();document.body.classList.add('open');$('frame').src=pageUrl(n.s)}
function openPanel(n){openMini(n)}
const mini=$('mini'),dcache=new Map();let miniTok=0,miniNode=null;
function closeMini(){miniTok++;document.body.classList.remove('mini-open')}
function detail(n){
  if(!dcache.has(n.s))dcache.set(n.s,(async()=>{
    try{
      const u=pageUrl(n.s),doc=new DOMParser().parseFromString(await(await fetch(u)).text(),'text/html');
      const art=doc.querySelector('article')||doc.body;
      const imgs=[...art.querySelectorAll('img')].map(i=>{const s=i.getAttribute('src')||'';const m=decodeURIComponent(s).match(/\d{4}-\d{2}-\d{2}/);return{s,d:m?m[0]:''}}).filter(x=>x.s);
      imgs.sort((a,b)=>b.d.localeCompare(a.d));
      const best=imgs[0];
      const md=((doc.querySelector('meta[name="description"]')||{}).content||'').trim();
      const ps=[...art.querySelectorAll('p')].filter(x=>noLinks(x).length>20).map(x=>x.textContent.trim()).filter(x=>x!==md);
      const txt=ps[0]||'';
      
      return{img:best?new URL(best.s,u).href:'',date:best?best.d:'',txt:txt||md};
    }catch(e){return{img:'',date:'',txt:''}}
  })());
  return dcache.get(n.s);
}
async function openMini(n){
  const tok=++miniTok;miniNode=n;document.body.classList.remove('open');
  const q=s=>mini.querySelector(s),im=q('.m-img');
  q('.m-title').textContent=n.t;q('.m-date').textContent='';q('.m-text').textContent='Cargando...';im.style.display='none';
  document.body.classList.add('mini-open');
  const d=await detail(n);if(tok!==miniTok)return;
  q('.m-text').textContent=d.txt||'Esta nota a\u00fan no tiene texto.';
  q('.m-date').textContent=d.date?'\u00daltima foto: '+d.date.split('-').reverse().join('/'):'';
  if(d.img){im.onload=()=>{const ar=im.naturalWidth/Math.max(1,im.naturalHeight);const w=Math.round(Math.min(Math.max(innerHeight*.5*ar,280),Math.min(480,innerWidth*.4)));document.body.style.setProperty('--mw',w+'px')};im.src=d.img;im.alt=n.t;im.style.display='block'}else{document.body.style.removeProperty('--mw')}
}
$('mclose').onclick=closeMini;mini.appendChild($('mclose'));
$('mfull').onclick=()=>{if(miniNode)openFull(miniNode)};
function closePanel(){document.body.classList.remove('open');closeMini()}
$('close').onclick=closePanel;

$('all').onclick=()=>{closePanel();setView(null)};$('goHome').onclick=()=>{closePanel();setView(home)};
// la ficha se muestra sin barras laterales ni pie, y en oscuro
$('frame').addEventListener('load',()=>{
  try{
    const d=$('frame').contentDocument;d.documentElement.setAttribute('saved-theme','dark');
    const st=d.createElement('style');st.textContent='.sidebar,footer{display:none!important}.center{max-width:none!important;margin:0 auto!important;padding:1rem 1.4rem!important}';d.head.appendChild(st);
  }catch(e){}
});
/* boton unico: alterna entre Atlas Fotografico y todo el atlas */
{const nav=$('nav'),tb=document.createElement('button');tb.id='toggleView';tb.type='button';nav.append(tb);
const _sv=setView;
const sync=f=>{tb.textContent=(home&&f===home)?'Ver todo el atlas':'Atlas Fotogr\u00e1fico'};
setView=function(f){_sv(f);sync(f)};
tb.onclick=()=>{closePanel();setView(home&&focus!==home?home:null)};}
/* Guia astronomica: tarjeta, entrada de menu y pantalla con buscador */
{
const COMPASS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>';
const NAME='Gu\u00eda Astron\u00f3mica';
const menu=$('page-menu'),stage=$('stage'),ft=$('featured-tools');
const gl=document.createElement('a');gl.id='guide-page-link';gl.href='#guia';
gl.innerHTML='<span>'+NAME+'</span>'+COMPASS.replace('<svg ','<svg class="map-icon" ');
menu.append(gl);
const fc=document.createElement('a');fc.id='featured-guide-link';fc.href='#guia';fc.setAttribute('aria-label','Abrir '+NAME);
fc.innerHTML='<span class="featured-icon" aria-hidden="true">'+COMPASS+'</span><span class="featured-copy"><span class="featured-name">'+NAME+'</span><span class="featured-description">Para aquellos que empiezan desde cero.</span></span><span class="featured-arrow" aria-hidden="true">\u2192</span>';
ft.append(fc);
const gv=document.createElement('section');gv.id='guide-view';gv.setAttribute('aria-label',NAME);
gv.innerHTML='<div id="g-search" class="g-in g-right" style="--d:.7s"><span aria-hidden="true">\u2315</span><input id="g-input" type="search" placeholder="Buscar objetos\u2026" autocomplete="off" aria-label="Buscar objetos"></div><div id="g-main"><div id="g-wrap"><h2 class="g-in" style="--d:.1s">'+NAME+'</h2><p class="g-lead g-in" style="--d:.4s">Para aquellos que empiezan desde cero.</p><p id="g-count" class="g-in" style="--d:.9s"></p><div id="g-grid"></div></div></div>';
stage.append(gv);
const gg=$('g-grid'),gc=$('g-count'),gi=$('g-input');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const cat=s=>/\/messier\//.test(s)?'Cat\u00e1logo Messier':/\/ngc\//.test(s)?'Cat\u00e1logo NGC':/sistsolar/.test(s)?'Sistema Solar':'Otros';
const objs=all.filter(n=>n.obj).sort((a,b)=>a.t.localeCompare(b.t,'es'));
function render(q,first){
  const ws=norm(q).split(/\s+/).filter(Boolean);
  const list=objs.filter(n=>{const h=norm(n.t+' '+cat(n.s)),h2=h.replace(/[\s_-]+/g,'');return ws.every(w=>h.includes(w)||h2.includes(w.replace(/[\s_-]+/g,'')))});
  gc.textContent=(ws.length?list.length+' de '+objs.length:objs.length)+(objs.length===1?' objeto fotografiado':' objetos fotografiados');
  gg.replaceChildren();
  list.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='g-card g-in';b.style.setProperty('--d',(first?1.1+i*.07:i*.025)+'s');b.innerHTML='<b></b><small></small>';b.firstChild.textContent=n.t;b.lastChild.textContent=cat(n.s);b.addEventListener('click',()=>openPanel(n));gg.append(b)});
  if(!list.length){const e=document.createElement('p');e.className='g-empty';e.textContent='No hay coincidencias.';gg.append(e)}
}
gi.addEventListener('input',()=>render(gi.value,false));
gi.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=gg.querySelector('.g-card');if(b)b.click()}});
function playGuide(){gi.value='';render('',true);gv.classList.remove('play');void gv.offsetWidth;gv.classList.add('play')}
const _spa=setPageActive;
setPageActive=function(page){
  const g=page==='guide';
  _spa(g?'atlas':page);
  document.body.classList.toggle('guide-page',g);
  if(g){atlasPageLink.removeAttribute('aria-current');gl.setAttribute('aria-current','page');playGuide()}else gl.removeAttribute('aria-current');
};
gl.addEventListener('click',ev=>{ev.preventDefault();setPageActive('guide')});
fc.addEventListener('click',ev=>{ev.preventDefault();setPageActive('guide')});
}
/* Precarga de previsualizaciones (HTML e imagenes) al entrar en el atlas o la guia */
{
let started=false;const keep=[];
function startPrefetch(){
  if(started)return;started=true;
  if(navigator.connection&&navigator.connection.saveData)return;
  const queue=all.filter(n=>n.obj).slice(0,60);let i=0;
  const next=async()=>{
    if(i>=queue.length)return;
    const n=queue[i++];
    try{
      const pv=await preview(n);
      const dd=typeof detail==='function'?await detail(n):null;
      new Set([pv&&pv.img,dd&&dd.img].filter(Boolean)).forEach(u=>{const im=new Image();im.decoding='async';im.src=u;keep.push(im)});
    }catch(e){}
    setTimeout(next,250);
  };
  setTimeout(next,600);
}
const _sp3=setPageActive;
setPageActive=function(page){if(page!=='principal')startPrefetch();return _sp3.apply(this,arguments)};
}
/* Grupos locales: ocultar los nodos "padre" (los mas cercanos al inicio que el grupo actual) */
const dist=new Map();
if(home){const q=[home];dist.set(home.s,0);while(q.length){const a=q.shift();a.adj.forEach(s=>{if(!dist.has(s)&&N[s]){dist.set(s,dist.get(a.s)+1);q.push(N[s])}})}}
function isParent(n,f){return n!==f&&dist.has(n.s)&&dist.has(f.s)&&dist.get(n.s)<dist.get(f.s)}
setView(home);
draw();
})();
</script>
