<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>&iquest;Qui&eacute;nes somos? &middot; Vero Cosmos</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{color-scheme:dark;--p0:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060f;color:#eef1ff;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
#base{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#111936 0%,#080b19 55%,#05060f 100%)}
#reveal{position:fixed;inset:0;overflow:hidden;clip-path:inset(0px 0px 0px 0px round 0px)}
.nv{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#111936 0%,#080b19 55%,#05060f 100%)}
.pu{position:absolute;inset:-10%;opacity:var(--p0);background:radial-gradient(ellipse at 25% 30%,rgba(124,72,210,.55),transparent 60%),radial-gradient(ellipse at 78% 72%,rgba(88,64,214,.45),transparent 62%),linear-gradient(135deg,#1a1048,#2d1561 55%,#150b3a);background-size:100% 100%,100% 100%,140% 140%}
.pu.go{animation:toPurple 3.2s ease forwards,drift 16s ease-in-out infinite alternate}
.st{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#dce5ff99 99%,transparent),radial-gradient(1px 1px at 73% 16%,#dce5ff80 99%,transparent),radial-gradient(1.5px 1.5px at 82% 72%,#dce5ff99 99%,transparent),radial-gradient(1px 1px at 27% 78%,#dce5ff80 99%,transparent),radial-gradient(1px 1px at 55% 61%,#dce5ff80 99%,transparent),radial-gradient(1px 1px at 91% 37%,#dce5ff80 99%,transparent),radial-gradient(1px 1px at 40% 12%,#dce5ff80 99%,transparent),radial-gradient(1.5px 1.5px at 8% 64%,#dce5ff99 99%,transparent);opacity:.7;animation:tw 6s ease-in-out infinite alternate}
@keyframes toPurple{from{opacity:var(--p0)}to{opacity:1}}
@keyframes drift{from{background-position:0 0,0 0,0% 0%}to{background-position:6% -4%,-5% 5%,100% 100%}}
@keyframes tw{from{opacity:.45}to{opacity:.85}}
@keyframes flo{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
#logo{position:fixed;z-index:3;object-fit:contain;opacity:0;user-select:none;-webkit-user-select:none;pointer-events:none;filter:drop-shadow(0 0 36px rgba(150,110,255,.4))}
#logo.fl{animation:flo 7s ease-in-out infinite alternate}
#txt{position:fixed;z-index:3;opacity:0}
#txtin h1{margin:0;font:400 clamp(38px,6.2vw,88px)/1.08 "Iowan Old Style",Georgia,serif;color:#f5f7ff;text-shadow:0 0 38px rgba(170,130,255,.35)}
#rule{width:72px;height:2px;margin:22px 0 0;border-radius:2px;background:linear-gradient(90deg,#b49bff,transparent)}
#below{min-height:80px}
#back{position:fixed;z-index:5;top:14px;left:16px;padding:9px 14px;border:1px solid #4a3d85;border-radius:10px;background:rgba(18,12,48,.7);color:#eef1ff;font:inherit;cursor:pointer;opacity:0}
#back:hover,#back:focus-visible{border-color:#b49bff;outline:none}
</style>
</head>
<body>
<div id="base"></div>
<div id="reveal"><div class="nv"></div><div class="pu"></div><div class="st"></div></div>
<main id="txt"><div id="txtin"><h1>&iquest;Qui&eacute;nes somos?</h1><div id="rule"></div><div id="below"></div></div></main>
<img id="logo" src="icon.png" alt="Vero Cosmos" draggable="false">
<button id="back" type="button">&larr; Volver</button>
<script>
(function(){
const $=id=>document.getElementById(id);
const reveal=$('reveal'),logo=$('logo'),txt=$('txt'),txtin=$('txtin'),pu=document.querySelector('.pu'),back=$('back');
const fromLogo=location.hash==='#desde-logo';
const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* misma formula que usa el boton del logo de la app, para que la transicion encaje */
function rect(W,H){
  const portrait=W<700||W<H*.9;
  if(portrait){const s=Math.min(W*.58,H*.3);return{x:(W-s)/2,y:Math.max(64,H*.1),s:s,p:true}}
  const s=Math.min(W*.4,H*.66);return{x:W*.7-s/2,y:(H-s)/2,s:s,p:false};
}
function place(){
  const r=rect(innerWidth,innerHeight);
  logo.style.left=r.x+'px';logo.style.top=r.y+'px';logo.style.width=r.s+'px';logo.style.height=r.s+'px';
  if(r.p){txt.style.left='7vw';txt.style.right='7vw';txt.style.maxWidth='none';txt.style.top=(r.y+r.s+26)+'px';txt.style.transform='none';txt.style.textAlign='center';$('rule').style.margin='22px auto 0'}
  else{txt.style.left='7vw';txt.style.right='auto';txt.style.maxWidth='40vw';txt.style.top='50%';txt.style.transform='translateY(-50%)';txt.style.textAlign='left';$('rule').style.margin='22px 0 0'}
}
function btnRect(){const W=innerWidth;return{x:W-16-40,y:12,s:40}}
function clip0(){const W=innerWidth,H=innerHeight,b=btnRect();return 'inset('+b.y+'px 16px '+(H-b.y-b.s)+'px '+b.x+'px round 11px)'}
const FULL='inset(0px 0px 0px 0px round 0px)',EASE='cubic-bezier(.7,0,.2,1)';
function show(){logo.style.opacity='1';txt.style.opacity='1';back.style.opacity='1'}
function intro(){
  place();
  if(fromLogo)document.documentElement.style.setProperty('--p0','.6');
  pu.classList.add('go');
  if(reduce||!reveal.animate){show();logo.classList.add('fl');return}
  const r=rect(innerWidth,innerHeight),b=btnRect();
  if(fromLogo){
    show();txtin.animate([{opacity:0,transform:'translateX(-40px)'},{opacity:1,transform:'none'}],{duration:700,delay:150,easing:'ease-out',fill:'both'});
    back.animate([{opacity:0},{opacity:1}],{duration:500,delay:500,fill:'both'});
    setTimeout(()=>logo.classList.add('fl'),300);return;
  }
  const T={duration:760,easing:EASE,fill:'both'};
  reveal.animate([{clipPath:clip0()},{clipPath:FULL}],T);
  logo.style.opacity='1';
  logo.animate([{left:b.x+'px',top:b.y+'px',width:b.s+'px',height:b.s+'px'},{left:r.x+'px',top:r.y+'px',width:r.s+'px',height:r.s+'px'}],T);
  txt.style.opacity='1';
  txtin.animate([{opacity:0,transform:'translateX(-40px)'},{opacity:1,transform:'none'}],{duration:700,delay:480,easing:'ease-out',fill:'both'});
  back.style.opacity='1';back.animate([{opacity:0},{opacity:1}],{duration:500,delay:800,fill:'both'});
  setTimeout(()=>logo.classList.add('fl'),900);
}
function go(){
  try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return}}catch(e){}
  location.href='../';
}
function leave(){
  if(reduce||!reveal.animate){go();return}
  logo.classList.remove('fl');
  const r=rect(innerWidth,innerHeight),b=btnRect(),T={duration:540,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'};
  reveal.animate([{clipPath:FULL},{clipPath:clip0()}],T);
  logo.animate([{left:r.x+'px',top:r.y+'px',width:r.s+'px',height:r.s+'px'},{left:b.x+'px',top:b.y+'px',width:b.s+'px',height:b.s+'px'}],T);
  txtin.animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});
  back.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  setTimeout(go,560);
}
back.addEventListener('click',leave);
document.addEventListener('keydown',e=>{if(e.key==='Escape')leave()});
addEventListener('resize',place);
intro();
})();
</script>
</body>
</html>
