<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#05060f;color:#eef1ff;font:15px/1.4 system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#111936 0%,#080b19 42%,#05060f 78%)}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#dce5ff99 99%,transparent),radial-gradient(1px 1px at 73% 16%,#dce5ff80 99%,transparent),radial-gradient(1.5px 1.5px at 82% 72%,#dce5ff99 99%,transparent),radial-gradient(1px 1px at 27% 78%,#dce5ff80 99%,transparent),radial-gradient(1px 1px at 55% 61%,#dce5ff80 99%,transparent),radial-gradient(1px 1px at 91% 37%,#dce5ff80 99%,transparent);opacity:.65;pointer-events:none}
h1{position:relative;margin:0;padding:0 24px;text-align:center;font:400 clamp(40px,8vw,96px)/1.1 "Iowan Old Style",Georgia,serif;color:#f5f7ff;text-shadow:0 0 35px #8ab4ff30}
.back{position:relative;margin-top:28px;color:#aebbe1;text-decoration:none;font-size:14px}
.back:hover{color:#eef1ff;text-decoration:underline}
#logo-btn{position:fixed;top:12px;right:16px;z-index:7;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:4px;border:1px solid #343b60;border-radius:11px;background:#0e1226ef;box-shadow:0 5px 22px #0003}
#logo-btn:hover,#logo-btn:focus-visible{border-color:#8ab4ff;outline:none}
#logo-btn img{display:block;width:100%;height:100%;object-fit:contain}
</style>
