name: Prueba SEO fichas (temporal)
on:
  push:
    branches: [claude/seo-prueba]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx quartz plugin install
      - run: npx quartz build
      - run: cp -r public public-antes && node tools/seo-fichas.mjs
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Comparar
        run: |
          node .github/prueba/servidor.mjs public-antes 8001 &
          node .github/prueba/servidor.mjs public 8002 &
          sleep 2
          node .github/prueba/comparar.mjs | tee resultados-log.txt
          echo "::notice title=resultado::$(tr '\n' '|' < resultados-log.txt)"
      - name: Enviar capturas como anotaciones
        run: |
          for f in resultados/*.jpg; do
            n=$(basename $f .jpg); base64 -w0 $f > /tmp/b64; split -b 30000 -d /tmp/b64 /tmp/part_$n_
            for c in /tmp/part_$n_*; do echo "::notice title=IMG $n $(basename $c)::$(cat $c)"; done
            rm -f /tmp/part_$n_*
          done
