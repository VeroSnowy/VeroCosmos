name: Prueba SEO fichas (temporal)
on:
  push:
    branches: [claude/seo-prueba]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx quartz plugin install
      - run: npx quartz build
      - run: cp -r public public-antes && node tools/seo-fichas.mjs
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Comparar
        run: |
          node .github/prueba/servidor.mjs public-antes 8001 &
          node .github/prueba/servidor.mjs public 8002 &
          sleep 2
          node .github/prueba/comparar.mjs | tee resultados-log.txt
          echo "::notice title=resultado::$(tr '\n' '|' < resultados-log.txt)"
      - name: Captura 2-ficha-3d-despues
        if: always()
        run: |
          node .github/prueba/reducir.mjs resultados/2-ficha-3d-despues.jpg /tmp/2-ficha-3d-despues.jpg 560
          base64 -w0 /tmp/2-ficha-3d-despues.jpg > /tmp/2-ficha-3d-despues.b64; split -b 4000 -d -a 2 /tmp/2-ficha-3d-despues.b64 /tmp/2-ficha-3d-despues.part
          echo "::notice title=SIZE 2-ficha-3d-despues::$(wc -c < /tmp/2-ficha-3d-despues.b64)"
          for c in /tmp/2-ficha-3d-despues.part*; do echo "::notice title=IMG 2-ficha-3d-despues ${c##*.part}::$(cat $c)"; done
      - name: Captura 3-pagina-google-despues
        if: always()
        run: |
          node .github/prueba/reducir.mjs resultados/3-pagina-google-despues.jpg /tmp/3-pagina-google-despues.jpg 560
          base64 -w0 /tmp/3-pagina-google-despues.jpg > /tmp/3-pagina-google-despues.b64; split -b 4000 -d -a 2 /tmp/3-pagina-google-despues.b64 /tmp/3-pagina-google-despues.part
          echo "::notice title=SIZE 3-pagina-google-despues::$(wc -c < /tmp/3-pagina-google-despues.b64)"
          for c in /tmp/3-pagina-google-despues.part*; do echo "::notice title=IMG 3-pagina-google-despues ${c##*.part}::$(cat $c)"; done
      - name: Captura 5-pagina-google-abajo
        if: always()
        run: |
          node .github/prueba/reducir.mjs resultados/5-pagina-google-abajo.jpg /tmp/5-pagina-google-abajo.jpg 560
          base64 -w0 /tmp/5-pagina-google-abajo.jpg > /tmp/5-pagina-google-abajo.b64; split -b 4000 -d -a 2 /tmp/5-pagina-google-abajo.b64 /tmp/5-pagina-google-abajo.part
          echo "::notice title=SIZE 5-pagina-google-abajo::$(wc -c < /tmp/5-pagina-google-abajo.b64)"
          for c in /tmp/5-pagina-google-abajo.part*; do echo "::notice title=IMG 5-pagina-google-abajo ${c##*.part}::$(cat $c)"; done
      - name: Captura 4-pagina-google-movil
        if: always()
        run: |
          node .github/prueba/reducir.mjs resultados/4-pagina-google-movil.jpg /tmp/4-pagina-google-movil.jpg 300
          base64 -w0 /tmp/4-pagina-google-movil.jpg > /tmp/4-pagina-google-movil.b64; split -b 4000 -d -a 2 /tmp/4-pagina-google-movil.b64 /tmp/4-pagina-google-movil.part
          echo "::notice title=SIZE 4-pagina-google-movil::$(wc -c < /tmp/4-pagina-google-movil.b64)"
          for c in /tmp/4-pagina-google-movil.part*; do echo "::notice title=IMG 4-pagina-google-movil ${c##*.part}::$(cat $c)"; done
