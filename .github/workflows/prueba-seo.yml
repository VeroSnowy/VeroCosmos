name: Prueba SEO fichas (temporal)
on:
  push:
    branches: [claude/seo-prueba]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx quartz plugin install
      - run: npx quartz build
      - run: cp -r public public-antes && node tools/seo-fichas.mjs
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Comparar
        run: |
          node .github/prueba/servidor.mjs public-antes 8001 &
          node .github/prueba/servidor.mjs public 8002 &
          sleep 2
          node .github/prueba/comparar.mjs | tee resultados-log.txt
          echo "::notice title=resultado::$(tr '\n' '|' < resultados-log.txt)"
      - name: Guardar resultados en una rama
        run: |
          mv resultados-log.txt resultados/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan claude/seo-prueba-resultados
          git rm -rq --cached .
          git add -f resultados
          git commit -qm "Resultados de la prueba"
          git push -f origin claude/seo-prueba-resultados
